apply plugin: 'com.android.application'

android {
    namespace 'com.superzara.game'
    compileSdkVersion 34
    defaultConfig {
        applicationId 'com.superzara.game'
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':unityLibrary')
}
